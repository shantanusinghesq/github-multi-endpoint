name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python scripts/validate_skill.py
      - name: Status script smoke test (exit 0 or 1 is a valid report; 2 is a failure)
        shell: bash
        run: |
          python skills/github-multi-endpoint/scripts/endpoint_status.py . || [ $? -eq 1 ]
